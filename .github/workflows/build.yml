name: strongR-frida

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: "temurin"
        java-version: "17"

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1.0.6
      with:
        ndk-version: r25b
    
    - name: Set up Python 3.9
      uses: actions/setup-python@v5.1.0
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        sudo apt-get update && DEBIAN_FRONTEND=noninteractive sudo apt-get install build-essential tree ninja-build gcc-multilib g++-multilib lib32stdc++-9-dev flex bison ruby ruby-dev python3-requests python3-setuptools python3-dev python3-pip libc6-dev libc6-dev-i386 -y
        sudo gem install fpm -v 1.11.0 --no-document
        python3 -m pip install lief graphlib

    - name: Build Frida for Android
      shell: bash
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "github-actions@github.com"
        
        # 直接拉取 Ylarod 的补丁仓库，不需要任何密钥！
        git clone https://github.com/Ylarod/Florida Patchs
        
        export ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}
        git clone --recurse-submodules https://github.com/frida/frida
        cd frida
        
        # 自动循环打补丁
        for path in ../Patchs/Patchs/strongR-frida/*
        do
          name=$(basename $path)
          real=$(realpath $path)
          echo "Apply patches in $real to frida/subprojects/$name"
          cd subprojects/$name
          git am ../../../Patchs/Patchs/strongR-frida/$name/*.patch
          cd ../..
        done
        cd ..
        
        ARCHES="android-arm android-arm64 android-x86 android-x86_64"
        for ARCH in $ARCHES
        do
          mkdir build-$ARCH
          cd build-$ARCH
          ../frida/configure --host=$ARCH
          make
          cd ..
        done

    - name: Package build results
      shell: bash
      run: |
        gzip build-android-arm/subprojects/frida-core/server/frida-server
        gzip build-android-arm64/subprojects/frida-core/server/frida-server
        gzip build-android-x86/subprojects/frida-core/server/frida-server
        gzip build-android-x86_64/subprojects/frida-core/server/frida-server
        
        gzip build-android-arm/subprojects/frida-core/inject/frida-inject
        gzip build-android-arm64/subprojects/frida-core/inject/frida-inject
        gzip build-android-x86/subprojects/frida-core/inject/frida-inject
        gzip build-android-x86_64/subprojects/frida-core/inject/frida-inject
        
        gzip build-android-arm/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip build-android-x86/subprojects/frida-core/lib/gadget/frida-gadget.so
        gzip build-android-x86_64/subprojects/frida-core/lib/gadget/frida-gadget.so

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: strongR-frida-android-builds
        path: |
          build-android-arm/subprojects/frida-core/server/frida-server.gz
          build-android-arm64/subprojects/frida-core/server/frida-server.gz
          build-android-x86/subprojects/frida-core/server/frida-server.gz
          build-android-x86_64/subprojects/frida-core/server/frida-server.gz
          build-android-arm/subprojects/frida-core/inject/frida-inject.gz
          build-android-arm64/subprojects/frida-core/inject/frida-inject.gz
          build-android-x86/subprojects/frida-core/inject/frida-inject.gz
          build-android-x86_64/subprojects/frida-core/inject/frida-inject.gz
          build-android-arm/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
          build-android-arm64/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
          build-android-x86/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
          build-android-x86_64/subprojects/frida-core/lib/gadget/frida-gadget.so.gz
        if-no-files-found: warn
